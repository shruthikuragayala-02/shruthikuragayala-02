<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Shruthi Kuragayala hero banner</title>
  <defs>
    <linearGradient id="gText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="gChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(34,211,238,0.22)"/>
      <stop offset="100%" stop-color="rgba(139,92,246,0.22)"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0 H0 V52" fill="none" stroke="#12192c" stroke-width="1"/>
    </pattern>
    <clipPath id="chipClip"><rect x="-92" y="-13" width="184" height="26" rx="13"/></clipPath>
  </defs>
  <rect width="900" height="300" fill="url(#gBg)"/>
  <rect width="900" height="300" fill="url(#grid)" opacity="0.4"/>
  <g filter="url(#softGlow)">
    <circle cx="120" cy="72" r="52" fill="#8b5cf6" opacity="0.08">
      <animate attributeName="cy" values="72;104;72" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.14;0.08" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="224" r="60" fill="#22d3ee" opacity="0.08">
      <animate attributeName="cy" values="224;192;224" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.14;0.08" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="450" y="130" text-anchor="middle" fill="url(#gText)" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">Shruthi Kuragayala</text>
  <g transform="translate(450,184)" clip-path="url(#chipClip)">
    <rect x="-92" y="-13" width="184" height="26" rx="13" fill="url(#gChip)" stroke="#22d3ee" stroke-width="1" opacity="0.95"/>
    <text x="0" y="3" text-anchor="middle" fill="#22d3ee" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.8">Open to internships</text>
  </g>
  <g text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="22" font-weight="500" transform="translate(450,242)">
    <text x="0" y="0" fill="#22d3ee" role="status">
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.24;0.25;1"/>
      Aspiring Software Engineer
    </text>
    <text x="0" y="0" fill="#8b5cf6" opacity="0" role="status">
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.50;1"/>
      Backend Developer
    </text>
    <text x="0" y="0" fill="#06b6d4" opacity="0" role="status">
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.49;0.50;0.74;0.75;1"/>
      Java and Spring Boot
    </text>
    <text x="0" y="0" fill="#22d3ee" opacity="0" role="status">
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.74;0.75;1"/>
      AI Explorer
    </text>
  </g>
</svg>
