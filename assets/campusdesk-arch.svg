<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="250" viewBox="0 0 520 250" role="img" aria-labelledby="cdArchTitle">
  <title id="cdArchTitle">CampusDesk architecture diagram</title>
  <defs>
    <linearGradient id="cdg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a17"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="520" height="250" fill="url(#cdg)"/>
  <g font-family="'Segoe UI', Inter, Arial, sans-serif">
    <!-- React -->
    <g transform="translate(30,90)">
      <rect width="150" height="70" rx="10" fill="#0b1224" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="75" y="42" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">React</text>
      <text x="75" y="62" text-anchor="middle" fill="#94a3b8" font-size="11">frontend</text>
    </g>
    <line x1="180" y1="125" x2="250" y2="125" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- Spring Boot -->
    <g transform="translate(260,75)">
      <rect width="160" height="100" rx="10" fill="#0b1224" stroke="url(#lg)" stroke-width="1.5"/>
      <text x="80" y="40" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">Spring Boot API</text>
      <text x="80" y="62" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="700">JWT + Spring Security</text>
      <text x="80" y="84" text-anchor="middle" fill="#94a3b8" font-size="11">status-transition validation</text>
      <text x="80" y="104" text-anchor="middle" fill="#94a3b8" font-size="11">SLA tracker &#8226; overdue detection</text>
      <text x="80" y="124" text-anchor="middle" fill="#94a3b8" font-size="11">audit history of ticket events</text>
    </g>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <line x1="420" y1="125" x2="490" y2="125" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr)"/>
    <!-- PostgreSQL -->
    <g transform="translate(500,90)">
      <rect width="150" height="70" rx="10" fill="#0b1224" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="75" y="42" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">PostgreSQL</text>
      <text x="75" y="62" text-anchor="middle" fill="#94a3b8" font-size="11">Flyway migrations</text>
    </g>
  </g>
</svg>
