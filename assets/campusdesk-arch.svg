<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="cdArchTitle">
  <title id="cdArchTitle">CampusDesk architecture diagram</title>
  <defs>
    <linearGradient id="cdg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a17"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="url(#cdg)"/>
  <g font-family="'Segoe UI', Inter, Arial, sans-serif">
    <g transform="translate(40,110)">
      <rect width="240" height="80" rx="10" fill="#0b1224" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="120" y="44" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">React</text>
      <text x="120" y="66" text-anchor="middle" fill="#94a3b8" font-size="14">frontend</text>
    </g>
    <line x1="280" y1="150" x2="340" y2="150" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(360,80)">
      <rect width="260" height="140" rx="10" fill="#0b1224" stroke="url(#lg)" stroke-width="1.5"/>
      <text x="130" y="42" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Spring Boot API</text>
      <text x="130" y="66" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">JWT + Spring Security</text>
      <text x="130" y="90" text-anchor="middle" fill="#94a3b8" font-size="14">status-transition validation</text>
      <text x="130" y="114" text-anchor="middle" fill="#94a3b8" font-size="14">SLA tracker &#8226; overdue detection</text>
      <text x="130" y="138" text-anchor="middle" fill="#94a3b8" font-size="14">audit history of ticket events</text>
    </g>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <line x1="620" y1="150" x2="680" y2="150" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(700,110)">
      <rect width="240" height="80" rx="10" fill="#0b1224" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="120" y="44" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">PostgreSQL</text>
      <text x="120" y="66" text-anchor="middle" fill="#94a3b8" font-size="14">Flyway migrations</text>
    </g>
  </g>
</svg>
