<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="eduTitle">
  <title id="eduTitle">Education timeline card for KMEC</title>
  <defs>
    <linearGradient id="edug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a17"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="eduAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="860" height="220" rx="20" fill="url(#edug)" stroke="rgba(148,163,184,0.12)" stroke-width="1"/>
  <rect x="40" y="60" width="8" height="140" fill="url(#eduAccent)" rx="4"/>
  <text x="70" y="80" fill="#f8fafc" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="700">2025-2029</text>
  <g transform="translate(140,70)">
    <text x="0" y="40" fill="#f8fafc" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="24" font-weight="800">B.Tech in Computer Science and Engineering</text>
    <text x="0" y="78" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16">Keshav Memorial Engineering College (KMEC), Osmania University</text>
    <text x="0" y="112" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16">Semester 1 GPA: 8.68 &#8226; Semester 2 GPA: 8.80</text>
    <text x="0" y="146" fill="#94a3b8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14">Hyderabad, Telangana</text>
  </g>
</svg>
