<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="pwArchTitle">
  <title id="pwArchTitle">PulseWatch architecture diagram</title>
  <defs>
    <linearGradient id="pwg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a17"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <marker id="parr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 Z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="url(#pwg)"/>
  <g font-family="'Segoe UI', Inter, Arial, sans-serif" fill="#cbd5e1">
    <g transform="translate(30,105)">
      <rect width="150" height="60" rx="10" fill="#0b1224" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="75" y="32" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Scheduler</text>
      <text x="75" y="54" text-anchor="middle" fill="#94a3b8" font-size="12">periodic checks</text>
    </g>
    <line x1="180" y1="135" x2="230" y2="135" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#parr)"/>
    <g transform="translate(240,90)">
      <rect width="170" height="80" rx="10" fill="#0b1224" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="85" y="34" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Health Checker</text>
      <text x="85" y="56" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="700">SSRF-safe URL validation</text>
      <text x="85" y="76" text-anchor="middle" fill="#94a3b8" font-size="12">response time + uptime</text>
    </g>
    <line x1="410" y1="135" x2="460" y2="135" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#parr)"/>
    <g transform="translate(470,105)">
      <rect width="150" height="60" rx="10" fill="#0b1224" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="75" y="32" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">PostgreSQL</text>
      <text x="75" y="54" text-anchor="middle" fill="#94a3b8" font-size="12">health-check data</text>
    </g>
    <line x1="620" y1="135" x2="670" y2="135" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#parr)"/>
    <g transform="translate(680,90)">
      <rect width="150" height="80" rx="10" fill="#0b1224" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="75" y="34" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Incident Detector</text>
      <text x="75" y="56" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="700">failure thresholds</text>
      <text x="75" y="76" text-anchor="middle" fill="#94a3b8" font-size="12">alert deduplication</text>
    </g>
    <line x1="830" y1="135" x2="880" y2="135" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#parr)"/>
    <g transform="translate(720,175)">
      <rect width="150" height="50" rx="10" fill="#0b1224" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="75" y="24" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Alerts</text>
      <text x="75" y="44" text-anchor="middle" fill="#94a3b8" font-size="12">notifications</text>
    </g>
  </g>
</svg>
