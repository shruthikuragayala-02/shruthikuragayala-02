<svg xmlns="http://www.w3.org" width="100%" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="pwArchTitle">
  <title id="pwArchTitle">PulseWatch architecture diagram</title>
  <defs>
    <linearGradient id="pwg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a17"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <marker id="parr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 Z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="1000" height="230" fill="url(#pwg)"/>
  <g font-family="'Segoe UI', Inter, Arial, sans-serif" fill="#cbd5e1">
    <g transform="translate(20,80)">
      <rect width="150" height="60" rx="10" fill="#0b1224" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="75" y="34" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Scheduler</text>
      <text x="75" y="54" text-anchor="middle" fill="#94a3b8" font-size="10">periodic checks</text>
    </g>
    <line x1="170" y1="110" x2="230" y2="110" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#parr)"/>
    <g transform="translate(240,70)">
      <rect width="170" height="80" rx="10" fill="#0b1224" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="85" y="36" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Health Checker</text>
      <text x="85" y="56" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="700">SSRF-safe URL validation</text>
      <text x="85" y="74" text-anchor="middle" fill="#94a3b8" font-size="10">response time + uptime</text>
      <text x="85" y="90" text-anchor="middle" fill="#94a3b8" font-size="10">stored in PostgreSQL</text>
    </g>
    <line x1="410" y1="110" x2="470" y2="110" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#parr)"/>
    <g transform="translate(480,80)">
      <rect width="150" height="60" rx="10" fill="#0b1224" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="75" y="34" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">PostgreSQL</text>
      <text x="75" y="54" text-anchor="middle" fill="#94a3b8" font-size="10">health-check data</text>
    </g>
    <line x1="630" y1="110" x2="690" y2="110" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#parr)"/>
    <g transform="translate(700,70)">
      <rect width="170" height="80" rx="10" fill="#0b1224" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="85" y="36" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Incident Detector</text>
      <text x="85" y="56" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="700">failure thresholds</text>
      <text x="85" y="74" text-anchor="middle" fill="#94a3b8" font-size="10">alert deduplication</text>
    </g>
    <line x1="870" y1="110" x2="930" y2="110" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#parr)"/>
    <g transform="translate(940,85)">
      <rect width="130" height="50" rx="10" fill="#0b1224" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="65" y="32" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Alerts</text>
      <text x="65" y="50" text-anchor="middle" fill="#94a3b8" font-size="10">notifications</text>
    </g>
  </g>
</svg>
