<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="aboutTitle">
  <title id="aboutTitle">About card with bio and currently panel</title>
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a17"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="gBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="860" height="300" rx="22" fill="url(#gBg)" stroke="url(#gBorder)" stroke-width="1" opacity="0.94"/>
  <g filter="url(#softGlow)">
    <circle cx="820" cy="40" r="70" fill="#8b5cf6" opacity="0.07">
      <animate attributeName="cy" values="40;70;40" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="280" r="60" fill="#22d3ee" opacity="0.07">
      <animate attributeName="cy" values="280;250;280" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="140" cy="130" r="46" fill="#111827" stroke="#22d3ee" stroke-width="1.5" opacity="0.9"/>
  <text x="140" y="136" text-anchor="middle" fill="#22d3ee" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="20" font-weight="800">SK</text>
  <text x="210" y="100" fill="#f8fafc" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="22" font-weight="700">Shruthi Kuragayala</text>
  <text x="210" y="128" fill="#22d3ee" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">Aspiring Software Engineer &#8226; Hyderabad, Telangana, India</text>
  <text x="210" y="160" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" line-height="1.8">Second-year B.Tech Computer Science student at KMEC, Osmania University.</text>
  <text x="210" y="190" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" line-height="1.8">Passionate about backend engineering, reliable software, and AI.</text>
  <text x="210" y="220" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" line-height="1.8">Seeking a software engineering internship.</text>
  <g transform="translate(600,110)">
    <rect x="0" y="0" width="260" height="190" rx="16" fill="#090c1a" stroke="rgba(148,163,184,0.14)" stroke-width="1"/>
    <text x="20" y="34" fill="#f8fafc" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="17" font-weight="700">Currently</text>
    <line x1="20" y1="42" x2="110" y2="42" stroke="#22d3ee" stroke-width="2"/>
    <text x="20" y="72" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="600">Learning</text>
    <text x="20" y="94" fill="#94a3b8" font-family="'JetBrains Mono', Courier New, monospace" font-size="14">Java &#8226; Spring Boot</text>
    <text x="20" y="122" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="600">Building</text>
    <text x="20" y="144" fill="#94a3b8" font-family="'JetBrains Mono', Courier New, monospace" font-size="14">CampusDesk &#8226; PulseWatch</text>
    <text x="20" y="172" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="600">Seeking</text>
    <text x="20" y="194" fill="#94a3b8" font-family="'JetBrains Mono', Courier New, monospace" font-size="14">Software engineering</text>
    <text x="20" y="216" fill="#94a3b8" font-family="'JetBrains Mono', Courier New, monospace" font-size="14">internship</text>
  </g>
</svg>
