<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="cdTitle">
  <title id="cdTitle">CampusDesk project card</title>
  <defs>
    <linearGradient id="cdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a17"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="cdBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="860" height="380" rx="20" fill="url(#cdBg)" stroke="url(#cdBorder)" stroke-width="1" opacity="0.94"/>
  <g filter="url(#softGlow)">
    <circle cx="800" cy="50" r="60" fill="#8b5cf6" opacity="0.08">
      <animate attributeName="cy" values="50;80;50" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="50" y="80" fill="#f8fafc" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="28" font-weight="800">CampusDesk</text>
  <text x="50" y="120" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" line-height="1.7">College issue management and SLA tracking system.</text>
  <text x="50" y="144" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" line-height="1.7">Students report campus issues and staff resolve them.</text>
  <text x="50" y="168" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" line-height="1.7">Role-based access for students, staff, and admins using JWT and Spring Security.</text>
  <text x="50" y="208" fill="#22d3ee" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="18" font-weight="700">Highlights</text>
  <g font-family="'JetBrains Mono', Courier New, monospace" font-size="14" fill="#94a3b8" text-anchor="start">
    <text x="50" y="236">&#9993; Role-based access via JWT + Spring Security</text>
    <text x="50" y="260">&#9993; PostgreSQL + Flyway migrations; status-validation</text>
    <text x="50" y="284">&#9993; SLA tracking, overdue detection, audit history</text>
  </g>
  <text x="50" y="320" fill="#22d3ee" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="18" font-weight="700">Tech stack</text>
  <g transform="translate(50,348)">
    <rect x="0" y="0" width="100" height="36" rx="18" fill="#0b1224" stroke="#22d3ee" stroke-width="1"/>
    <text x="50" y="26" text-anchor="middle" fill="#22d3ee" font-family="'JetBrains Mono', Courier New, monospace" font-size="14" font-weight="700">Java</text>
    <rect x="112" y="0" width="140" height="36" rx="18" fill="#0b1224" stroke="#22d3ee" stroke-width="1"/>
    <text x="182" y="26" text-anchor="middle" fill="#22d3ee" font-family="'JetBrains Mono', Courier New, monospace" font-size="14" font-weight="700">Spring Boot</text>
    <rect x="264" y="0" width="130" height="36" rx="18" fill="#0b1224" stroke="#22d3ee" stroke-width="1"/>
    <text x="329" y="26" text-anchor="middle" fill="#22d3ee" font-family="'JetBrains Mono', Courier New, monospace" font-size="14" font-weight="700">PostgreSQL</text>
    <rect x="406" y="0" width="90" height="36" rx="18" fill="#0b1224" stroke="#22d3ee" stroke-width="1"/>
    <text x="451" y="26" text-anchor="middle" fill="#22d3ee" font-family="'JetBrains Mono', Courier New, monospace" font-size="14" font-weight="700">React</text>
    <rect x="508" y="0" width="80" height="36" rx="18" fill="#0b1224" stroke="#22d3ee" stroke-width="1"/>
    <text x="548" y="26" text-anchor="middle" fill="#22d3ee" font-family="'JetBrains Mono', Courier New, monospace" font-size="14" font-weight="700">JWT</text>
  </g>
  <a href="https://github.com/shruthikuragayala-02" target="_blank">
    <rect x="50" y="402" width="260" height="56" rx="14" fill="#0b1224" stroke="#22d3ee" stroke-width="1"/>
    <text x="180" y="434" text-anchor="middle" fill="#22d3ee" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="700" text-decoration="underline">View repository</text>
  </a>
</svg>
