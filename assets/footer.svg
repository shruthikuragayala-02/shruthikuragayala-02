<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="130" viewBox="0 0 1100 130" role="img" aria-labelledby="footTitle">
  <title id="footTitle">Animated gradient footer banner</title>
  <defs>
    <linearGradient id="footg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="footbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <filter id="footglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1100" height="130" fill="url(#footbg)"/>
  <rect x="40" y="24" width="1020" height="82" rx="20" fill="url(#footg)" opacity="0.12"/>
  <g filter="url(#footglow)">
    <circle cx="960" cy="65" r="55" fill="#8b5cf6" opacity="0.10">
      <animate attributeName="cy" values="65;95;65" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="550" y="82" text-anchor="middle" fill="#f8fafc" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="0.5">Thanks for visiting my profile</text>
  <text x="550" y="106" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="1">Aspiring software engineer &#8226; backend &#8226; AI &#8226; Open to internships</text>
</svg>
