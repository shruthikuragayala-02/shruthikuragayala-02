<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="termTitle">
  <title id="termTitle">Animated terminal card showing whoami, role, stack, focus</title>
  <defs>
