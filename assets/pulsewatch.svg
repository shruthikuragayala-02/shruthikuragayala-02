<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="470" viewBox="0 0 520 470" role="img" aria-labelledby="pwTitle pwDesc">
  <title id="pwTitle">PulseWatch project card</title>
  <desc id="pwDesc">Mini production monitoring platform</desc>
  <defs>
    <linearGradient id="pwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a17"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="pwBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="480" height="430" rx="20" fill="url(#pwBg)" stroke="url(#pwBorder)" stroke-width="1" opacity="0.94"/>
  <g filter="url(#softGlow)">
    <circle cx="450" cy="50" r="50" fill="#22d3ee" opacity="0.10">
      <animate attributeName="cy" values="50;80;50" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="40" y="70" fill="#f8fafc" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="20" font-weight="800">PulseWatch</text>
  <text x="40" y="96" fill="#94a3b8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="500" line-height="1.4">Mini production monitoring platform that periodically checks website and API availability, records response times, and calculates uptime from stored health-check data.</text>
  <text x="40" y="130" fill="#8b5cf6" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700">Highlights</text>
  <g font-family="'JetBrains Mono', Courier New, monospace" font-size="12.5" fill="#cbd5e1" text-anchor="start">
    <text x="40" y="156">&gt;  Periodic website/API availability checks with response-time recording and uptime calculation</text>
    <text x="40" y="182">&gt;  Incident detection with failure thresholds and alert deduplication; SSRF-safe URL validation</text>
    <text x="40" y="208">&gt;  Docker plus GitHub Actions workflow for automated testing and deployment</text>
  </g>
  <text x="40" y="244" fill="#8b5cf6" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700">Tech stack</text>
  <g transform="translate(40,268)">
    <rect x="0" y="0" width="62" height="26" rx="13" fill="#0b1224" stroke="#8b5cf6" stroke-width="1"/>
    <text x="31" y="17" text-anchor="middle" fill="#8b5cf6" font-family="'JetBrains Mono', Courier New, monospace" font-size="11" font-weight="700">Java</text>
    <rect x="70" y="0" width="78" height="26" rx="13" fill="#0b1224" stroke="#8b5cf6" stroke-width="1"/>
    <text x="109" y="17" text-anchor="middle" fill="#8b5cf6" font-family="'JetBrains Mono', Courier New, monospace" font-size="11" font-weight="700">Spring Boot</text>
    <rect x="156" y="0" width="74" height="26" rx="13" fill="#0b1224" stroke="#8b5cf6" stroke-width="1"/>
    <text x="193" y="17" text-anchor="middle" fill="#8b5cf6" font-family="'JetBrains Mono', Courier New, monospace" font-size="11" font-weight="700">PostgreSQL</text>
    <rect x="238" y="0" width="52" height="26" rx="13" fill="#0b1224" stroke="#8b5cf6" stroke-width="1"/>
    <text x="264" y="17" text-anchor="middle" fill="#8b5cf6" font-family="'JetBrains Mono', Courier New, monospace" font-size="11" font-weight="700">React</text>
    <rect x="298" y="0" width="56" height="26" rx="13" fill="#0b1224" stroke="#8b5cf6" stroke-width="1"/>
    <text x="326" y="17" text-anchor="middle" fill="#8b5cf6" font-family="'JetBrains Mono', Courier New, monospace" font-size="11" font-weight="700">Docker</text>
  </g>
  <a href="https://github.com/shruthikuragayala-02/pulsewatch" target="_blank">
    <rect x="40" y="312" width="170" height="40" rx="12" fill="#0b1224" stroke="#8b5cf6" stroke-width="1"/>
    <text x="125" y="336" text-anchor="middle" fill="#8b5cf6" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" text-decoration="underline">View repository</text>
  </a>
</svg>
